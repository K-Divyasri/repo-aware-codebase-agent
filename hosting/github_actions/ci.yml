# GitHub Actions workflow for the Repo-Aware Codebase Agent.
#
# What it does: on every push and every pull request, GitHub spins up a fresh Linux
# machine, installs Python and the project's dependencies, generates the toy
# `cartlogic` repo the agent operates on, and runs the pytest suite. Pass -> green
# checkmark on the commit. Fail -> a red X and a log to read. Free on public repos.
#
# Why it needs no secrets: the whole suite runs FULLY OFFLINE -- parsing (Python's own
# `ast` module), the call graph, the hashing embedder, the sandbox, and the offline
# KNOWN_FIXES planner all need no API key and no model download. Nothing here calls
# Claude or any paid service, so this workflow is keyless.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your repo
# (the repo root is the whole repo-aware-codebase-agent/ folder, the one that
# contains codeagent/). GitHub only runs workflow files under .github/workflows/.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # A standard, free Linux runner. The code is pure Python, so it passes on Linux
    # even though you develop on Windows.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt lives at the repo root.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pyproject.toml at the repo root sets testpaths = ["tests"], so a
      # bare `pytest -q` from the repo root finds the whole suite. conftest.py's
      # `ensure_target_repo` autouse fixture generates data/target_repo (the toy
      # `cartlogic` codebase, generated rather than committed) the first time any
      # test needs it, so a fresh checkout just works.
      - name: Run tests
        run: pytest -q
